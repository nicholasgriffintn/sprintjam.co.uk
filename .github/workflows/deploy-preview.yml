name: Deploy Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Preview
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(fromJSON('["dependabot[bot]", "renovate[bot]", "renovate"]'), github.event.pull_request.user.login)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/preview-output.jsonl
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm --filter @sprintjam/app build

      - name: Create or update Preview
        working-directory: apps/app
        run: pnpm exec wrangler preview --name "pr-${{ github.event.pull_request.number }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Create or update preview comment
        run: bash .github/scripts/comment-preview.sh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  cleanup:
    name: Delete Preview
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(fromJSON('["dependabot[bot]", "renovate[bot]", "renovate"]'), github.event.pull_request.user.login)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Delete Preview
        working-directory: apps/app
        run: >-
          pnpm exec wrangler preview delete
          --name "pr-${{ github.event.pull_request.number }}"
          --skip-confirmation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
