name: Deploy Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    name: Deploy Preview
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm --filter @sprintjam/app build

      - name: Create or update Preview
        id: preview
        working-directory: apps/app
        run: |
          set -o pipefail
          output="$(pnpm exec wrangler preview --name "pr-${{ github.event.pull_request.number }}" --json)"
          printf '%s\n' "$output"
          json="$(printf '%s\n' "$output" | sed -n '/^{/,$p')"
          if ! preview_url="$(printf '%s' "$json" | jq -er '(.preview_urls // .preview.urls) | map(select(endswith(".sprintjam.co.uk"))) | first')"; then
            pnpm exec wrangler preview delete --name "pr-${{ github.event.pull_request.number }}" --skip-confirmation
            echo "::error title=Cloudflare Preview domain disabled::Enable sprintjam.co.uk for Production and Preview in the Worker's Domains settings, then rerun this job."
            exit 1
          fi
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Probe Preview
        run: curl --fail --show-error --silent "$PREVIEW_URL/robots.txt"
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}

      - name: Comment Preview URL
        run: >-
          gh pr comment "${{ github.event.pull_request.number }}"
          --body "Cloudflare Worker Preview: ${{ steps.preview.outputs.preview_url }}"
          --edit-last
          --create-if-none
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup:
    name: Delete Preview
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Delete Preview
        working-directory: apps/app
        run: >-
          pnpm exec wrangler preview delete
          --name "pr-${{ github.event.pull_request.number }}"
          --skip-confirmation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
